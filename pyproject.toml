[project]
name = "personalpythonsite"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "reactpy[starlette]==1.1.0",
    "python-jsx==0.4.0",
    "uvicorn[standard]==0.48.0",
    "aiofiles>=23.0",
    "starlette<0.21.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["mypy==1.10.*", "pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.mypy]
strict = true
exclude = ["(components|pages)/.*\\.pyx?$"]

[[tool.mypy.overrides]]
module = ["reactpy.*", "pyjsx.*", "components.*", "pages.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# main.py must register the pyjsx import hook before importing components
"main.py" = ["E402"]
